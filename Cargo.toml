[package]
name = "gmsv_exporter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
rglua = { version = "3.0.0" }
prometheus = "0.14"
lazy_static = "1.5.0"
tiny_http = "0.12"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
log = "0.4.29"
tracing-subscriber = "0.3.23"
once_cell = "1.21.3"