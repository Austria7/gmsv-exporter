name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            target: i686-unknown-linux-gnu
            name: gmsv_exporter_linux.dll
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            name: gmsv_exporter_linux64.dll
          - os: windows-2022
            target: i686-pc-windows-msvc
            name: gmsv_exporter_win32.dll
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            name: gmsv_exporter_win64.dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux 32-bit dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp target/${{ matrix.target }}/release/gmsv_exporter.dll ${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/libgmsv_exporter.so ${{ matrix.name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-26.04

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/gmsv_exporter_linux.dll/gmsv_exporter_linux.dll
            artifacts/gmsv_exporter_linux64.dll/gmsv_exporter_linux64.dll
            artifacts/gmsv_exporter_win32.dll/gmsv_exporter_win32.dll
            artifacts/gmsv_exporter_win64.dll/gmsv_exporter_win64.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
